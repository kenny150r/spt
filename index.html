<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Sam's Baby Tracker</title>
    <script>
      // Apply the theme synchronously before React mounts so users don't
      // see a light-mode flash. Mirrors loadMode() in src/lib/theme.ts:
      // default to 'dark' when nothing is stored.
      (function () {
        try {
          var stored = localStorage.getItem('spt-theme-mode-v1')
          var mode = stored === 'light' || stored === 'dark' || stored === 'system'
            ? stored
            : 'dark'
          var resolved = mode === 'system'
            ? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
            : mode
          if (resolved === 'dark') document.documentElement.classList.add('dark')
          // Joke setting: apply Papyrus before paint so the font doesn't
          // pop in after mount. Mirrors loadPapyrus() in src/lib/papyrus.ts —
          // default ON unless the user explicitly turned it off ('0').
          if (localStorage.getItem('spt-papyrus-v1') !== '0') {
            document.documentElement.classList.add('papyrus')
          }
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
